<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>P10 Auth minimal — header + footer pair</title>
<script>(()=>{try{const t=new URLSearchParams(location.search).get('theme');const d=document.documentElement;d.dataset.theme=(t==='dark'||t==='light')?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(new URLSearchParams(location.search).has('frame'))d.dataset.frame='';}catch(e){}})();</script>
<style>
:root{
  --bg:#f9fbfc; --surface:#ffffff; --surface-2:#f4f8f9; --tint:#edf4f6; --mint:#eef7f5;
  --mesh-1:#d8e8e9; --mesh-2:#daeaeb;
  --ink:#0a2543; --ink-2:#123a5e; --body:#4a5c6e; --muted:#5f7080; --line:#e3ebe9;
  --teal:#24877f; --teal-hover:#1c6f68; --teal-soft:#d9ece9; --glow:#3fb8ab; --live:#22a06b;
  --btn:#1f7a73;                       /* teal CTA fill, nudged for AA with white text */
  --band:#0a2543; --band-text:#e8eef4; --band-body:#b9c6d0; --band-line:rgba(255,255,255,.12);
  --shadow:0 8px 28px rgba(10,37,67,.10);
  --pill:999px; --card:14px; --chip:8px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0b1720; --surface:#0f1e29; --surface-2:#12242f; --tint:#102530; --mint:#10272a;
  --mesh-1:#12303a; --mesh-2:#0f2a33;
  --ink:#e8eef4; --ink-2:#d3dde6; --body:#b9c6d0; --muted:#8aa0b3; --line:rgba(255,255,255,.08);
  --teal:#2fa59b; --teal-hover:#3fb8ab; --teal-soft:#14343a;
  --band:#06111a; --shadow:0 8px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:400 16px/1.5 var(--font);color:var(--body);background:var(--bg)}
[hidden]{display:none!important}
ul{list-style:none;margin:0;padding:0}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:12px;top:-60px;z-index:1000;padding:10px 16px;border-radius:var(--chip);background:var(--ink);color:var(--bg);font-weight:600}
.skip:focus{top:12px}
.ic{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{display:inline-flex;align-items:center;flex:none}
.logo img{height:auto}
.logo__d{display:none}
[data-theme="dark"] .logo__l{display:none}
[data-theme="dark"] .logo__d,.logo__d.is-only{display:block}
.i-moon{display:none}
[data-theme="dark"] .i-sun{display:none}
[data-theme="dark"] .i-moon{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border:1px solid transparent;border-radius:var(--pill);background:var(--btn);color:#fff;font:600 15px/1 var(--font);cursor:pointer;white-space:nowrap;transition:background-color .18s ease-out,transform .18s ease-out}
.btn:hover{background:var(--teal-hover)}
.btn:active{transform:scale(.98)}
.btn--ghost{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:inset 0 0 0 1px var(--line)}
.btn--ghost:hover{background:var(--mint)}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;transition:background-color .18s ease-out}
.iconbtn:hover{background:var(--mint)}
.eyebrow{margin:0 0 14px;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.demo{max-width:720px;margin:0 auto;padding:64px 24px 40px}
.demo h1{margin:0 0 12px;color:var(--ink);font-size:clamp(28px,4vw,40px);line-height:1.15;letter-spacing:-.02em}
.demo p{margin:0 0 16px}
.demo--tall{min-height:130vh}
[data-frame] .demo{display:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

:root{--w:1200px}

.hd{background:transparent}
.hd__in{display:flex;align-items:center;justify-content:space-between;max-width:var(--w);height:88px;margin:0 auto;padding:0 24px}
.hd .iconbtn .ic{transition:transform .16s ease-out}
.hd .iconbtn:hover .ic{transform:rotate(20deg)}

.ft{background:transparent}
.ft__in{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:var(--w);margin:0 auto;padding:28px 24px;font-size:13px;text-align:center}
.ft__in p{margin:0}
.ft__links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px}
.ft__links a{padding:8px 0;color:var(--muted);transition:color .16s ease-out}
.ft__links a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
@media (min-width:760px){.ft__in{flex-direction:row;justify-content:space-between;text-align:left;padding:0 24px;min-height:88px}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="hd" role="banner">
  <div class="hd__in"><a class="logo " href="#" aria-label="Nestlancer home"><img class="logo__l" src="../../assets/logo-full-light.svg" width="131" height="36" alt="Nestlancer"><img class="logo__d" src="../../assets/logo-full-dark.svg" width="131" height="36" alt="Nestlancer"></a><button type="button" class="iconbtn" data-theme-toggle aria-pressed="false" aria-label="Toggle color theme"><svg class="ic i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="ic i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button></div>
</header>

<main class="demo demo--tall" id="main">
  <p class="eyebrow">FIG · PORTAL</p>
  <h1>Product studio + client portal.</h1>
  <p>Fixed-price quotes, Razorpay milestones, live Project Hub.</p>
  <p>₹4,28,500 payments · ₹4.2L milestone · Payouts cleared 1/3</p>
</main>

<footer class="ft" role="contentinfo">
  <div class="ft__in">
    <a class="logo " href="#" aria-label="Nestlancer home"><img class="logo__l" src="../../assets/logo-mark-light.svg" width="31" height="32" alt="Nestlancer"><img class="logo__d" src="../../assets/logo-mark-dark.svg" width="31" height="32" alt="Nestlancer"></a>
    <p>© 2026 Nestlancer. Made in India. All rights reserved.</p>
    <nav class="ft__links" aria-label="Legal"><a href="#">Terms</a><a href="#">Privacy</a><a href="#">Verify document</a></nav>
  </div>
</footer>
<script>
document.querySelectorAll('[data-theme-toggle]').forEach(function(b){
  b.setAttribute('aria-pressed',document.documentElement.dataset.theme==='dark');
  b.addEventListener('click',function(){
    var d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';
    d.dataset.theme=n;b.setAttribute('aria-pressed',n==='dark');
  });
});
</script>
</body>
</html>
