<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<title>Nestlancer chrome gallery — 100 headers + 100 footers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="../tokens/tokens.css"/>
<style>
:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
body{margin:0;background:var(--n-bg);color:var(--n-body);font-family:var(--n-font-sans);padding:28px}
h1{font-family:var(--n-font-display);color:var(--n-ink);font-size:32px;margin:0 0 6px}
.sub{color:var(--n-muted);margin:0 0 18px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button,.toolbar input,.toolbar select{padding:9px 14px;border-radius:var(--n-radius-pill);border:1px solid var(--n-hairline);background:var(--n-surface);color:var(--n-body);font:inherit;font-size:13px}
.filters button{cursor:pointer}
.filters button.active{background:var(--n-ink);color:#fff;border-color:var(--n-ink)}
.toolbar input{min-width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:18px}
.card{border:1px solid var(--n-hairline);border-radius:var(--n-radius-card);background:var(--n-surface);overflow:hidden}
.card header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--n-hairline)}
.card header b{font-family:var(--n-font-mono);font-size:12px;color:var(--n-ink)}
.card .meta{font-size:12px;color:var(--n-muted);margin-right:auto}
.card .open{font-size:12px;color:var(--n-teal);font-weight:600}
.card .axes{margin:0;padding:8px 14px;font-size:11px;color:var(--n-muted);border-bottom:1px solid var(--n-hairline);font-family:var(--n-font-mono)}
.card iframe{width:100%;height:264px;border:0;background:var(--n-bg);display:block}
.card iframe.tall{height:600px}
@media (max-width:640px){.grid{grid-template-columns:1fr}body{padding:16px}}
</style>
</head>
<body>
<h1>Nestlancer chrome gallery</h1>
<p class="sub">200 variants · 45 families · six-axis uniqueness · <span id="counts"></span></p>
<div class="toolbar">
  <div class="filters">
    <button data-f="all" class="active">All</button>
    <button data-f="header">Headers</button>
    <button data-f="footer">Footers</button>
  </div>
  <input id="search" type="search" placeholder="Search id, family or axis…" aria-label="Search variants"/>
  <select id="themeSel" aria-label="Preview theme"><option value="light">Light</option><option value="dark">Dark</option></select>
</div>
<main class="grid" id="grid"></div>
<script src="./app.js" defer></script>
</body>
</html>
